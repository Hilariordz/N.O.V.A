name: nova

services:
  nova-ollama:
    image: ollama/ollama:latest
    container_name: nova-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=20m
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  nova-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nova-webui
    restart: unless-stopped
    depends_on:
      nova-ollama:
        condition: service_healthy
    environment:
      - WEBUI_NAME=N.O.V.A.
      - OLLAMA_BASE_URL=http://nova-ollama:11434
    volumes:
      - webui_data:/app/backend/data
    ports:
      - "3000:8080"

volumes:
  ollama_data:
  webui_data: